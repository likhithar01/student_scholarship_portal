{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Internships</h2>

    {% for i in internships %}
    <div class="card p-3 mb-3">
        <h4>{{ i.title }}</h4>
        <p>{{ i.description }}</p>
        <p><b>Category:</b> {{ i.category }}</p>
    </div>
    {% endfor %}

</div>

{% endblock %}
