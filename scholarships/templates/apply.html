{% extends 'base.html' %}

{% block content %}

<h2>Apply for {{ scholarship.title }}</h2>

{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">
    <label for="id_full_name" class="form-label">Full Name</label>
    <input type="text" id="id_full_name" name="full_name" class="form-control" required>
</div>

<div class="mb-3">
    <label for="id_email" class="form-label">Email</label>
    <input type="email" id="id_email" name="email" class="form-control" required>
</div>

<div class="mb-3">
    <label for="id_marks" class="form-label">Marks</label>
    <input type="number" id="id_marks" name="marks" class="form-control" required>
</div>

<div class="mb-3">
    <label for="id_income" class="form-label">Income</label>
    <input type="number" id="id_income" name="income" class="form-control" required>
</div>

<div class="mb-3">
    <label for="id_document" class="form-label">Upload Document</label>
    <input type="file" id="id_document" name="document" class="form-control" required>
</div>

<button class="btn btn-primary">Submit Application</button>

</form>

{% endblock %}
