<!DOCTYPE html>
<html>
<head>

<title>Student Scholarship Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container">

<a class="navbar-brand" href="/">Scholarship Portal</a>

<a class="btn btn-light" href="/scholarships/">Browse Scholarships</a>

</div>
</nav>

<div class="container mt-5">

<div class="p-5 text-center bg-primary text-white rounded">

<h1>Student Scholarship Portal</h1>

<p>Find and apply for scholarships easily</p>

<a class="btn btn-light" href="/scholarships/">Browse Scholarships</a>

</div>

<h2 class="mt-5 text-center">Latest Scholarships</h2>

<div class="row mt-4">

{% for scholarship in scholarships %}

<div class="col-md-4">

<div class="card p-3">

<h5>{{ scholarship.title }}</h5>

<p>{{ scholarship.description }}</p>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
