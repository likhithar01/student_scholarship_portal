{% extends 'base.html' %}
{% block content %}

<h2>Scholarships</h2>

<form method="GET" class="mb-3">
    <input type="text" name="q" placeholder="Search scholarships..." class="form-control">
</form>

<div class="row">
    {% for s in scholarships %}
    <div class="col-md-4">
        <div class="card p-3 mb-3">
            <h5>{{ s.title }}</h5>
            <p>{{ s.description }}</p>
            <p><b>Eligibility:</b> {{ s.eligibility }}</p>
            <p><b>Deadline:</b> {{ s.deadline }}</p>

            <a href="/apply/{{ s.id }}/" class="btn btn-primary">Apply</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
