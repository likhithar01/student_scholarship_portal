{% extends "base.html" %}
{% block content %}

<div class="p-5 text-center bg-primary text-white rounded">
<h1>Student Scholarship Portal</h1>
<p>Find and apply for scholarships easily</p>
<a href="/scholarships/" class="btn btn-light">Browse Scholarships</a>
</div>

<h2 class="mt-5">Latest Scholarships</h2>

<div class="row">
{% for s in scholarships %}
<div class="col-md-4">
<div class="card p-3">
<h4>{{ s.title }}</h4>
<p>{{ s.description }}</p>
</div>
</div>
{% endfor %}
</div>

{% endblock %}
