{% extends "base.html" %}
{% block content %}

<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#667eea,#764ba2);">
  <div style="background:white; padding:40px; border-radius:16px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.2);">
    
    <div style="text-align:center; margin-bottom:30px;">
      <div style="font-size:48px;">🎓</div>
      <h2 style="color:#333; font-weight:700; margin:10px 0 5px;">Welcome Back!</h2>
      <p style="color:#888; margin:0;">Login to your scholarship portal</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      
      <div style="margin-bottom:20px;">
        <label style="font-weight:600; color:#555; display:block; margin-bottom:8px;">👤 Username</label>
        <input class="form-control" name="username" placeholder="Enter your username" 
               style="padding:12px; border-radius:8px; border:2px solid #eee; font-size:15px;">
      </div>

      <div style="margin-bottom:25px;">
        <label style="font-weight:600; color:#555; display:block; margin-bottom:8px;">🔒 Password</label>
        <input class="form-control" name="password" type="password" placeholder="Enter your password"
               style="padding:12px; border-radius:8px; border:2px solid #eee; font-size:15px;">
      </div>

      {% if error %}
      <div style="background:#ffe0e0; color:#d00; padding:10px; border-radius:8px; margin-bottom:15px; text-align:center;">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <button type="submit" class="btn btn-primary w-100" 
              style="padding:13px; border-radius:8px; font-size:16px; font-weight:600; background:linear-gradient(135deg,#667eea,#764ba2); border:none;">
        Login →
      </button>
    </form>

    <p style="text-align:center; margin-top:20px; color:#888;">
      Don't have an account? 
      <a href="{% url 'register' %}" style="color:#667eea; font-weight:600;">Register here</a>
    </p>

  </div>
</div>

{% endblock %}
