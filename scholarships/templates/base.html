<!DOCTYPE html>
<html>
<head>
    <title>Student Scholarship Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f7fa; }
        .navbar-brand { font-weight:800; font-size:20px; letter-spacing:0.5px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3" style="background:linear-gradient(135deg,#667eea,#764ba2);">
    <a class="navbar-brand" href="/">🎓 Student Scholarship Portal</a>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a href="/" class="btn btn-light btn-sm" style="font-weight:600;">Home</a>
        <a href="/internships/" class="btn btn-warning btn-sm" style="font-weight:600;">Internships</a>
        {% if user.is_authenticated %}
            <a href="/dashboard/" class="btn btn-success btn-sm" style="font-weight:600;">Dashboard</a>
            <a href="/logout/" class="btn btn-danger btn-sm" style="font-weight:600;">Logout</a>
        {% else %}
            <a href="/login/" class="btn btn-light btn-sm" style="font-weight:600;">Login</a>
            <a href="/register/" class="btn btn-info btn-sm" style="font-weight:600; color:white;">Register</a>
        {% endif %}
    </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
