{% extends "base.html" %}
{% block content %}

<h2>Browse Scholarships</h2>

<form method="GET">
<input class="form-control" name="q" placeholder="Search scholarships">
<button class="btn btn-primary mt-2">Search</button>
</form>

{% for s in scholarships %}
<div class="card mt-3 p-3">
<h4>{{ s.title }}</h4>
<p>{{ s.description }}</p>
<p>Eligibility: {{ s.eligibility }}</p>
<p>Deadline: {{ s.deadline }}</p>
<a href="/apply/{{ s.id }}/" class="btn btn-success">Apply</a>
</div>
{% endfor %}

{% endblock %}
