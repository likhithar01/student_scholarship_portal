<!DOCTYPE html>
<html>
<head>

<title>Browse Scholarships</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Browse Scholarships</h2>

<form method="GET">

<input class="form-control" type="text" name="q" placeholder="Search scholarships">

<button class="btn btn-primary mt-2">Search</button>

</form>

<hr>

{% for scholarship in scholarships %}

<div class="card p-3 mt-3">

<h4>{{ scholarship.title }}</h4>

<p>{{ scholarship.description }}</p>

<p><b>Eligibility:</b> {{ scholarship.eligibility }}</p>

<p><b>Deadline:</b> {{ scholarship.deadline }}</p>

</div>

{% endfor %}

</div>

</body>
</html>
