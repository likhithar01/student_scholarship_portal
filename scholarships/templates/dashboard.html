{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">My Applications</h2>

<table class="table table-bordered">

<tr>
<th>Scholarship</th>
<th>Applied On</th>
</tr>

{% for app in applications %}

<tr>
<td>{{ app.scholarship.title }}</td>
<td>{{ app.applied_on }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
